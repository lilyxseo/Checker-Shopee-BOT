name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/telegram-webhook/index.ts
      - run: deno test --allow-read tests/core.test.ts
      - uses: supabase/setup-cli@v1
        with:
          version: 2.54.11
      - run: supabase start
      - run: psql postgresql://postgres:postgres@127.0.0.1:54322/postgres -v ON_ERROR_STOP=1 -f supabase/tests/bot.sql
      - run: python3 tests/concurrency.py
